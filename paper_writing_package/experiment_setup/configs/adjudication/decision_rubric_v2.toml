rubric_version = "decision-adjudication-2026-08-06-r2"
construct = "deterministic normalization plus blinded semantic coding of invalid free-generated Refinement-Need Decisions"
primary_parser = "The complete response after surrounding-whitespace removal must be exactly PRESERVE or REFINE."

[normalization]
rule_version = "decision-terminal-period-2026-08-06-r1"
rule = "After removing surrounding whitespace, remove exactly one terminal ASCII period only when the entire response is PRESERVE. or REFINE.; make no other change."

[preserve]
rule = "For non-normalized responses, code PRESERVE only when the response unambiguously says the initial candidate is functionally correct, satisfies the task specification, or needs no functional change."

[refine]
rule = "For non-normalized responses, code REFINE only when the response unambiguously identifies a functional defect or says a functional revision is needed."

[unresolved]
rule = "Use UNRESOLVED for mixed, contradictory, merely descriptive, or directionally incomplete output. Never force a binary label."

[evidence]
allowed = ["raw Decision response", "prompt-visible task specification", "exact initial candidate"]
forbidden = [
  "reference solution",
  "hidden or public benchmark tests",
  "candidate evaluation outcome",
  "compiler or runtime diagnostic",
  "timeout or runtime measurement",
  "critique, plan, or revised candidate",
]

[reporting]
preserve_original_invalid_call = true
report_normalized_separately = true
report_semantic_adjudication_separately = true
report_by_model = true
report_unresolved = true
sensitivity_analysis_exact_only = true
