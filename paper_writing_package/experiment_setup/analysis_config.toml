schema_version = "analysis-configuration-v4"
analysis_version = "primary-analysis-2026-08-08-r4"
processed_schema_version = "processed-outcomes-v3"
stage_call_schema_version = "processed-stage-calls-v3"
metrics_schema_version = "rq-metrics-v3"
confidence_level = 0.95
bootstrap_resamples = 10000
bootstrap_seed = 20260804
missing_outcome_policy = "model_malformed_as_zero_timeouts_and_infrastructure_indeterminate"
source_normalization = "lf_trailing_whitespace_outer_blank_lines_v1"
primary_success_measure = "end_to_end_success_with_model_malformed_candidate_as_zero"

[rq1]
contrasts = ["direct:r", "r:cr", "cr:cpr"]

[rq2]
contrasts = ["r:dr", "cr:dcr", "cpr:dcpr"]
decision_sensitivity = ["all_resolved", "exact_only"]

[rq3]
contrasts = ["cr:sc_cr", "cpr:sc_cpr", "dr:sc_dr", "dcr:sc_dcr", "dcpr:sc_dcpr"]

[rq4]
pareto_protocols = ["direct", "r", "cr", "cpr", "dr", "dcr", "dcpr", "sc_cr", "sc_cpr", "sc_dr", "sc_dcr", "sc_dcpr"]
pareto_missing_policy = "common_complete_case"
