schema_version = "analysis-configuration-v2"
analysis_version = "primary-analysis-2026-08-06-r2"
processed_schema_version = "processed-outcomes-v2"
stage_call_schema_version = "processed-stage-calls-v2"
metrics_schema_version = "rq-metrics-v2"
confidence_level = 0.95
bootstrap_resamples = 10000
bootstrap_seed = 20260804
missing_outcome_policy = "model_malformed_as_zero_timeouts_and_infrastructure_indeterminate"
source_normalization = "lf_trailing_whitespace_outer_blank_lines_v1"
primary_success_measure = "end_to_end_success_with_model_malformed_candidate_as_zero"

[rq1]
contrasts = ["direct:r", "r:cr", "cr:cpr"]

[rq3]
contrasts = ["r:dr", "cr:dcr", "cpr:dcpr"]
decision_sensitivity = ["all_resolved", "exact_only"]

[rq4]
pareto_protocols = ["direct", "r", "cr", "cpr", "dr", "dcr", "dcpr"]
pareto_missing_policy = "common_complete_case"
